<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Record System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Automated Healthcare Record System</h1>
        <p>Using DevOps and Cloud Technologies</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Patients</a>
        <a href="#">Appointments</a>
        <a href="#">Doctors</a>
        <a href="#">Contact</a>
    </nav>

    <!-- Patient Registration -->

    <section class="hero">

        <h2>Patient Registration</h2>

        <form id="patientForm">

            <input type="text"
                   id="name"
                   placeholder="Enter Patient Name"
                   required>

            <input type="number"
                   id="age"
                   placeholder="Enter Age"
                   required>

            <input type="text"
                   id="disease"
                   placeholder="Enter Disease"
                   required>

            <button type="submit">
                Register Patient
            </button>

        </form>

    </section>

    <!-- Appointment Booking -->

    <section class="appointment-section">

        <h2>Book Appointment</h2>

        <form id="appointmentForm">

            <input type="text"
                   id="patientName"
                   placeholder="Patient Name"
                   required>

            <input type="text"
                   id="doctorName"
                   placeholder="Doctor Name"
                   required>

            <input type="date"
                   id="appointmentDate"
                   required>

            <button type="submit">
                Book Appointment
            </button>

        </form>

    </section>

    <!-- Patient Records -->

    <section class="patient-data">

        <h2>Patient Records</h2>

        <div id="output"></div>

    </section>

    <!-- Appointment Records -->

    <section class="appointment-data">

        <h2>Appointment Records</h2>

        <div id="appointmentOutput"></div>

    </section>

    <footer>
        <p>© 2026 Healthcare Record System</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
